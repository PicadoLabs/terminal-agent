[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "terminal-agent-cli"
version = "0.1.0"
description = "Autonomous terminal-based coding agent designed around verifiable software changes. Build. Verify. Ship."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "PicadoLabs", email = "picadolabs@gmail.com" }
]

keywords = [
    "terminal",
    "coding-agent",
    "autonomous",
    "verification",
    "ai",
    "developer-tools",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]

dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.1",
    "gitpython>=3.1.43",
    "psutil>=5.9.8",
]

[project.urls]
Homepage = "https://picadolabs.me"
Documentation = "https://github.com/PicadoLabs/terminal-agent#readme"
Repository = "https://github.com/PicadoLabs/terminal-agent"
Issues = "https://github.com/PicadoLabs/terminal-agent/issues"

[project.optional-dependencies]
docker = [
    "docker>=7.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
terminal-agent = "terminal_agent.cli.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/terminal_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = [".", "src"]
addopts = "-v --tb=short"
